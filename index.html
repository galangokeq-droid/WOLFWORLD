<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WOLFWORLD Control Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/navigation.css" />
    <link rel="stylesheet" href="css/modules.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <main id="login-view" class="login-page">
      <section class="glass login-card" aria-labelledby="login-title">
        <div class="login-avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" />
          </svg>
        </div>

        <header class="login-brand">
          <h1 id="login-title">Login</h1>
          <p>Selamat datang kembali! Silakan masuk untuk melanjutkan.</p>
        </header>

        <div id="login-error" class="alert alert-error" role="alert" hidden></div>

        <form id="login-form" class="login-form" novalidate>
          <div class="field">
            <label class="field-label" for="email">Email</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <path d="M3 7l9 6 9-6" />
              </svg>
              <input class="field-input" id="email" name="email" type="email" autocomplete="username" placeholder="nama@email.com" required />
            </div>
            <span class="field-error" id="email-error" hidden></span>
          </div>

          <div class="field">
            <label class="field-label" for="password">Password</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect x="5" y="11" width="14" height="10" rx="2" />
                <path d="M8 11V8a4 4 0 0 1 8 0v3" />
              </svg>
              <input class="field-input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required />
              <button type="button" class="password-toggle" id="password-toggle" aria-controls="password" aria-pressed="false">Tampilkan</button>
            </div>
            <span class="field-error" id="password-error" hidden></span>
          </div>

          <div class="login-options">
            <label>
              <input type="checkbox" id="remember" name="remember" checked />
              Ingat sesi saya
            </label>
            <button type="button" class="link-button" id="forgot-password">Lupa password?</button>
          </div>

          <button type="submit" class="btn btn-login" id="submit-button">Login</button>
        </form>
      </section>
    </main>

    <div id="dashboard-view" class="app-shell" hidden>
      <header class="topbar glass">
        <button type="button" class="menu-button" id="menu-button" aria-label="Buka menu" aria-controls="drawer" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="topbar-title">
          <strong>WOLFWORLD</strong>
          <h2 id="page-title">Dashboard</h2>
        </div>

        <button type="button" class="bell-button" id="notification-button" aria-label="Aktifkan notifikasi" title="Aktifkan notifikasi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8" />
            <path d="M10.3 21a1.9 1.9 0 0 0 3.4 0" />
          </svg>
        </button>
      </header>

      <section id="dashboard-content" class="content">
        <p id="notification-status" class="notification-status" hidden></p>
        <div id="dashboard-error" class="alert alert-error" role="alert" hidden></div>

        <div id="stats-grid" class="stats-grid"></div>

        <div class="panels-grid">
          <section class="glass panel">
            <h3>Pesanan Terbaru</h3>
            <ul id="recent-orders" class="list"></ul>
          </section>
          <section class="glass panel">
            <h3>Pembayaran Terbaru</h3>
            <ul id="recent-payments" class="list"></ul>
          </section>
          <section class="glass panel">
            <h3>Aktivitas Terbaru</h3>
            <ul id="recent-activities" class="list"></ul>
          </section>
        </div>
      </section>

      <section id="module-content" class="content" hidden></section>

      <div id="drawer-overlay" class="drawer-overlay" hidden></div>

      <aside id="drawer" class="drawer glass" aria-label="Menu lengkap" aria-hidden="true">
        <div class="sidebar-brand">
          <strong>WOLFWORLD</strong>
          <span>Owner Panel</span>
        </div>

        <nav class="drawer-nav" aria-label="Menu lengkap">
          <p class="nav-group">Overview</p>
          <button type="button" class="nav-item is-active" data-page="dashboard" aria-current="page">Dashboard</button>

          <p class="nav-group">Bisnis</p>
          <button type="button" class="nav-item" disabled>Customer Management <span class="nav-soon">Segera</span></button>
          <button type="button" class="nav-item" data-page="orders">Orders Management</button>
          <button type="button" class="nav-item" disabled>Products Management <span class="nav-soon">Segera</span></button>
          <button type="button" class="nav-item" disabled>Services Management <span class="nav-soon">Segera</span></button>
          <button type="button" class="nav-item" disabled>Projects Management <span class="nav-soon">Segera</span></button>
          <button type="button" class="nav-item" data-page="payments">Payments Management</button>

          <p class="nav-group">Keuangan</p>
          <button type="button" class="nav-item" disabled>Financial Reports <span class="nav-soon">Segera</span></button>

          <p class="nav-group">Sistem</p>
          <button type="button" class="nav-item" disabled>Admin Management <span class="nav-soon">Segera</span></button>
          <button type="button" class="nav-item" disabled>Activity Logs <span class="nav-soon">Segera</span></button>
          <button type="button" class="nav-item" disabled>System Settings <span class="nav-soon">Segera</span></button>
        </nav>

        <div class="sidebar-footer">
          <p id="user-name" class="user-name"></p>
          <button type="button" class="btn btn-secondary" id="logout-button">Keluar</button>
        </div>
      </aside>

      <nav class="bottom-nav glass" aria-label="Navigasi utama">
        <button type="button" class="bottom-nav-item is-active" data-page="dashboard" aria-current="page">
          <span class="bottom-nav-icon" aria-hidden="true">🏠</span>
          <span>Dashboard</span>
        </button>
        <button type="button" class="bottom-nav-item" disabled>
          <span class="bottom-nav-icon" aria-hidden="true">📊</span>
          <span>Laporan</span>
        </button>
        <button type="button" class="bottom-nav-item bottom-nav-featured" data-page="payments">
          <span class="bottom-nav-featured-circle" aria-hidden="true">💳</span>
          <span>Pembayaran</span>
        </button>
        <button type="button" class="bottom-nav-item" disabled>
          <span class="bottom-nav-icon" aria-hidden="true">🕘</span>
          <span>Aktivitas</span>
        </button>
        <button type="button" class="bottom-nav-item" disabled>
          <span class="bottom-nav-icon" aria-hidden="true">👤</span>
          <span>Profil</span>
        </button>
      </nav>
    </div>

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/notifications.js"></script>
  </body>
</html>
