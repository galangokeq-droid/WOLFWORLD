<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WOLFWORLD Control Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <main id="login-view" class="login-page">
      <section class="glass login-card" aria-labelledby="login-title">
        <header class="login-brand">
          <h1 id="login-title">WOLFWORLD</h1>
          <p>Owner &amp; Admin Control Center</p>
        </header>

        <div id="login-error" class="alert alert-error" role="alert" hidden></div>

        <form id="login-form" class="login-form" novalidate>
          <div class="field">
            <label class="field-label" for="email">Email</label>
            <input class="field-input" id="email" name="email" type="email" autocomplete="username" required />
            <span class="field-error" id="email-error" hidden></span>
          </div>

          <div class="field">
            <label class="field-label" for="password">Password</label>
            <div class="password-field">
              <input class="field-input" id="password" name="password" type="password" autocomplete="current-password" required />
              <button type="button" class="password-toggle" id="password-toggle" aria-controls="password" aria-pressed="false">Tampilkan</button>
            </div>
            <span class="field-error" id="password-error" hidden></span>
          </div>

          <div class="login-options">
            <label>
              <input type="checkbox" id="remember" name="remember" checked />
              Ingat sesi saya
            </label>
            <button type="button" class="link-button" id="forgot-password">Lupa password?</button>
          </div>

          <button type="submit" class="btn btn-primary" id="submit-button">Masuk</button>
        </form>
      </section>
    </main>

    <div id="dashboard-view" class="app-shell" hidden>
      <aside class="sidebar glass">
        <div class="sidebar-brand">
          <strong>WOLFWORLD</strong>
          <span>Owner Panel</span>
        </div>

        <nav class="sidebar-nav" aria-label="Menu utama">
          <p class="nav-group">Overview</p>
          <button type="button" class="nav-item is-active" aria-current="page">Dashboard</button>

          <p class="nav-group">Bisnis</p>
          <button type="button" class="nav-item" disabled>Customer Management <span class="nav-soon">Segera</span></button>
          <button type="button" class="nav-item" disabled>Orders Management <span class="nav-soon">Segera</span></button>
          <button type="button" class="nav-item" disabled>Products Management <span class="nav-soon">Segera</span></button>
          <button type="button" class="nav-item" disabled>Services Management <span class="nav-soon">Segera</span></button>
          <button type="button" class="nav-item" disabled>Projects Management <span class="nav-soon">Segera</span></button>
          <button type="button" class="nav-item" disabled>Payments Management <span class="nav-soon">Segera</span></button>

          <p class="nav-group">Keuangan</p>
          <button type="button" class="nav-item" disabled>Financial Reports <span class="nav-soon">Segera</span></button>

          <p class="nav-group">Sistem</p>
          <button type="button" class="nav-item" disabled>Admin Management <span class="nav-soon">Segera</span></button>
          <button type="button" class="nav-item" disabled>Activity Logs <span class="nav-soon">Segera</span></button>
          <button type="button" class="nav-item" disabled>System Settings <span class="nav-soon">Segera</span></button>
        </nav>

        <div class="sidebar-footer">
          <p id="user-name" class="user-name"></p>
          <button type="button" class="btn btn-secondary" id="logout-button">Keluar</button>
        </div>
      </aside>

      <div class="main-area">
        <header class="topbar glass">
          <h2>Dashboard</h2>
          <span class="topbar-note">Ringkasan seluruh aktivitas bisnis</span>
        </header>

        <section class="content">
          <div id="dashboard-error" class="alert alert-error" role="alert" hidden></div>

          <div id="stats-grid" class="stats-grid"></div>

          <div class="panels-grid">
            <section class="glass panel">
              <h3>Pesanan Terbaru</h3>
              <ul id="recent-orders" class="list"></ul>
            </section>
            <section class="glass panel">
              <h3>Pembayaran Terbaru</h3>
              <ul id="recent-payments" class="list"></ul>
            </section>
            <section class="glass panel">
              <h3>Aktivitas Terbaru</h3>
              <ul id="recent-activities" class="list"></ul>
            </section>
          </div>
        </section>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
